[package]
name = "web1"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
parquet = "60.1.0"
rand = "0.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
arrow-schema = "60.1.0"
arrow = "60.1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }
futures = "0.3"
